services:
  api:
    build: .
    env_file: .env
    # OpenAI secure-container capabilities required by Codex bubblewrap.
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - /home/nilish/.vscode-server/extensions/openai.chatgpt-26.5825.41651-linux-x64/bin/linux-x86_64/codex:/usr/local/bin/codex:ro
      - /home/nilish/.vscode-server/extensions/openai.chatgpt-26.5825.41651-linux-x64/bin/linux-x86_64/codex-code-mode-host:/usr/local/bin/codex-code-mode-host:ro
      - /home/nilish/.codex/auth.json:/home/app/.codex/auth.json:ro
      - /home/nilish/.codex/config.toml:/home/app/.codex/config.toml:ro
      - /srv/projects/ai-playground:/srv/projects/ai-playground
      - /srv/projects/project-two-web:/srv/projects/project-two-web
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ai_playground
      POSTGRES_USER: ai_playground
      POSTGRES_PASSWORD: ai_playground
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_playground -d ai_playground"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:

